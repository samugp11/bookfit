<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crea tu cuenta en BookFit y empieza a reservar clases hoy mismo." />
  <title>Crear cuenta — BookFit</title>
  <script src="assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col transition-colors duration-200">

  <nav class="bg-white dark:bg-gray-800 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-blue-700 dark:text-blue-400 tracking-tight">Book<span class="text-gray-800 dark:text-gray-100">Fit</span></a>
      <div class="flex items-center gap-3">
        <button onclick="toggleTema()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
          <i class="theme-icon w-4 h-4 text-gray-600 dark:text-gray-300" data-lucide="moon"></i>
        </button>
        <a href="login.html" class="text-sm text-gray-600 dark:text-gray-300 hover:text-blue-700 font-medium">¿Ya tienes cuenta? <span class="text-blue-700 dark:text-blue-400 underline">Inicia sesión</span></a>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 w-full max-w-md p-8">

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Crear cuenta</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Únete a BookFit y reserva tus clases favoritas</p>
      </div>

      <div id="error-msg" class="hidden mb-4 flex items-center gap-2 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm px-4 py-3 rounded-xl">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="error-text"></span>
      </div>

      <div id="success-msg" class="hidden mb-4 flex items-center gap-2 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 text-sm px-4 py-3 rounded-xl">
        <i data-lucide="check-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="success-text"></span>
      </div>

      <form id="registro-form" novalidate>
        <div class="mb-4">
          <label for="nombre" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nombre completo</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i data-lucide="user" class="w-4 h-4"></i></span>
            <input id="nombre" type="text" autocomplete="name" placeholder="Tu nombre"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:placeholder-gray-500" />
          </div>
          <p id="nombre-error" class="text-red-500 text-xs mt-1 hidden">El nombre es obligatorio</p>
        </div>

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i data-lucide="mail" class="w-4 h-4"></i></span>
            <input id="email" type="email" autocomplete="email" placeholder="tu@email.com"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:placeholder-gray-500" />
          </div>
          <p id="email-error" class="text-red-500 text-xs mt-1 hidden">Introduce un email válido</p>
        </div>

        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i data-lucide="lock" class="w-4 h-4"></i></span>
            <input id="password" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"
              class="w-full pl-10 pr-10 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:placeholder-gray-500" />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <p id="pass-error" class="text-red-500 text-xs mt-1 hidden">La contraseña debe tener al menos 6 caracteres</p>
        </div>

        <div class="mb-6">
          <label for="password2" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Confirmar contraseña</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i data-lucide="lock" class="w-4 h-4"></i></span>
            <input id="password2" type="password" autocomplete="new-password" placeholder="Repite la contraseña"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400 dark:placeholder-gray-500" />
          </div>
          <p id="pass2-error" class="text-red-500 text-xs mt-1 hidden">Las contraseñas no coinciden</p>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-blue-700 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-800 transition flex items-center justify-center gap-2">
          <i data-lucide="user-plus" class="w-4 h-4"></i> Crear cuenta
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        ¿Ya tienes cuenta? <a href="login.html" class="text-blue-700 dark:text-blue-400 font-medium hover:underline">Inicia sesión</a>
      </p>
    </div>
  </main>

  <script>
    const API = 'http://localhost:3000/api';
    lucide.createIcons();
    actualizarIconoTema();

    let passVisible = false;
    function togglePassword() {
      passVisible = !passVisible;
      document.getElementById('password').type = passVisible ? 'text' : 'password';
      document.getElementById('eye-icon').setAttribute('data-lucide', passVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.remove('hidden');
      lucide.createIcons();
    }

    function validar() {
      let ok = true;
      ['nombre-error','email-error','pass-error','pass2-error'].forEach(id =>
        document.getElementById(id).classList.add('hidden')
      );
      document.getElementById('error-msg').classList.add('hidden');
      if (!document.getElementById('nombre').value.trim()) {
        document.getElementById('nombre-error').classList.remove('hidden'); ok = false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value.trim())) {
        document.getElementById('email-error').classList.remove('hidden'); ok = false;
      }
      if (document.getElementById('password').value.length < 6) {
        document.getElementById('pass-error').classList.remove('hidden'); ok = false;
      }
      if (document.getElementById('password').value !== document.getElementById('password2').value) {
        document.getElementById('pass2-error').classList.remove('hidden'); ok = false;
      }
      return ok;
    }

    document.getElementById('registro-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validar()) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Creando cuenta...';
      lucide.createIcons();

      try {
        const res  = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre:   document.getElementById('nombre').value.trim(),
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Error al crear la cuenta');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="user-plus" class="w-4 h-4"></i> Crear cuenta';
          lucide.createIcons();
          return;
        }

        document.getElementById('success-text').textContent = data.mensaje;
        document.getElementById('success-msg').classList.remove('hidden');
        lucide.createIcons();
        document.getElementById('registro-form').reset();
        setTimeout(() => window.location.href = 'login.html', 2000);

      } catch {
        showError('No se pudo conectar con el servidor.');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="user-plus" class="w-4 h-4"></i> Crear cuenta';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
