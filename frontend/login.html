<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicia sesión en BookFit para gestionar tus reservas de clases." />
  <title>Iniciar sesión — BookFit</title>
  <script src="assets/js/theme.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col transition-colors duration-200">

  <nav class="bg-white dark:bg-gray-800 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-blue-700 dark:text-blue-400 tracking-tight">Book<span class="text-gray-800 dark:text-gray-100">Fit</span></a>
      <div class="flex items-center gap-3">
        <button onclick="toggleTema()" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
          <i class="theme-icon w-4 h-4 text-gray-600 dark:text-gray-300" data-lucide="moon"></i>
        </button>
        <a href="registro.html" class="text-sm text-gray-600 dark:text-gray-300 hover:text-blue-700 font-medium">¿No tienes cuenta? <span class="text-blue-700 dark:text-blue-400 underline">Regístrate</span></a>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 w-full max-w-md p-8">

      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Bienvenido de nuevo</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Introduce tus datos para continuar</p>
      </div>

      <div id="error-msg" class="hidden mb-4 flex items-center gap-2 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm px-4 py-3 rounded-xl">
        <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <i data-lucide="mail" class="w-4 h-4"></i>
            </span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com"
              class="w-full pl-10 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400 dark:placeholder-gray-500" />
          </div>
          <p id="email-error" class="text-red-500 text-xs mt-1 hidden">Introduce un email válido</p>
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
              class="w-full pl-10 pr-10 py-2.5 border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400 dark:placeholder-gray-500" />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <p id="pass-error" class="text-red-500 text-xs mt-1 hidden">La contraseña es obligatoria</p>
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-blue-700 text-white font-semibold py-2.5 rounded-xl hover:bg-blue-800 transition flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i> Iniciar sesión
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
        ¿No tienes cuenta? <a href="registro.html" class="text-blue-700 dark:text-blue-400 font-medium hover:underline">Regístrate gratis</a>
      </p>
    </div>
  </main>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
    lucide.createIcons();
    actualizarIconoTema();

    let passVisible = false;
    function togglePassword() {
      passVisible = !passVisible;
      document.getElementById('password').type = passVisible ? 'text' : 'password';
      document.getElementById('eye-icon').setAttribute('data-lucide', passVisible ? 'eye-off' : 'eye');
      lucide.createIcons();
    }

    function showError(msg) {
      document.getElementById('error-text').textContent = msg;
      document.getElementById('error-msg').classList.remove('hidden');
      lucide.createIcons();
    }

    function validar() {
      let ok = true;
      document.getElementById('email-error').classList.add('hidden');
      document.getElementById('pass-error').classList.add('hidden');
      document.getElementById('error-msg').classList.add('hidden');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById('email').value.trim())) {
        document.getElementById('email-error').classList.remove('hidden'); ok = false;
      }
      if (!document.getElementById('password').value) {
        document.getElementById('pass-error').classList.remove('hidden'); ok = false;
      }
      return ok;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validar()) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Entrando...';
      lucide.createIcons();

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email:    document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Error al iniciar sesión');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Iniciar sesión';
          lucide.createIcons();
          return;
        }

        localStorage.setItem('token',  data.token);
        localStorage.setItem('rol',    data.rol);
        localStorage.setItem('nombre', data.nombre);
        localStorage.setItem('id',     data.id);

        window.location.href = data.rol === 'admin' ? 'admin.html' : 'clases.html';

      } catch {
        showError('No se pudo conectar con el servidor.');
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Iniciar sesión';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
